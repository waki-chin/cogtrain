<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogTrain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <link href= "/styles/style.css" rel="stylesheet">
    <link rel="icon" href=".">
</head>
<body>
    <div id="gameScreen" class="screens">
        <header>
            <button class="returnBtn">◀</button>
            <p class="gameNDisplayer"></p>
        </header>
        <div id="squareGrid">
            <svg viewBox='0 0 300 310' style='position:relative;top:0;left:0;width:100%;height:100%'>
                <rect class='box' width=99px height=99px rx=5px ry=5px x=0px     y=0px  />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=102.5px y=0px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=205px   y=0px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=0px     y=102.5px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=205px   y=102.5px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=0px     y=205px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=102.5px y=205px />
                <rect class='box' width=99px height=99px rx=5px ry=5px x=205px   y=205px />
            </svg>
        </div>
        <div id="divGameBtns">
            <button id="btnVis">
                <img id="imgVis" src="/images/eye.svg">
            </button>
            <button id="btnSpk">
                <img id="imgSpk" src="/images/speaker.svg">
            </button>
        </div>
    </div>
    <div id="resultScreen" class="screens">
        <header>
            <button class="returnBtn">◀</button>
            <div class="resultNDisplayer">
                <button class="beigeText btnNResult btnNMinus" id="btnMinusResult">-</button>
                <p class="NDisplayer resultNDisplayerText"></p>
                <button class="beigeText btnNResult btnNAdd" id="btnAddResult">+</button>
            </div>
            <p class="resultGoalText dailyNumber beigeText"></p>
        </header>
        <div id="divResultSet">

                    <g transform="matrix(0.97764922,0,0,0.97764922,3.2662669,2.1750385)">
                        <path id="p1" fill="currentColor"
                            d="m 137.952,194.162 c 0,-45.65 26.778,-84.941 65.465,-103.301 C 80.414,113.164 0,203.542 0,203.542 c 76.718,63.365 149.197,91.197 214.016,98.334 -44.298,-15.79 -76.063,-57.989 -76.063,-107.714 z"/>

                        <path id="p5" fill="currentColor"
                            d="m 124.032,96.038 -23.756,-51.3 27.876,-12.909 23.756,51.3 z"/>
                        <path id="p6" fill="currentColor"
                            d="M 227.765,72.635 228.615,0 l 30.717,0.359 -0.85,72.635 z"/>
                    </g>
                </svg>
                <p class="beigeText infoSetTxt firstMatch" id="visAccuracyTxt"></p>
                <p id="visMatches" class="greenTxt infoSetTxt"></p>
                <p id="visMisses" class="redTxt infoSetTxt"></p>
                <p id="visFalses" class="redTxt infoSetTxt"></p>
            </div>
            <div id="divInfoSet">
                <p class="beigeText infoSetTxt" id="genAccuracyTxt"></p>
                <p class="beigeText infoSetTxt">accuracy</p>
                <p class="beigeText infoSetTxt">matches</p>
                <p class="beigeText infoSetTxt">misses</p>
                <p class="beigeText infoSetTxt">falses</p>
                <button id="btnReplay">
                    <svg id="replayImg" version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                        <g transform="matrix(2.408601,3.7631993,-3.7631993,2.408601,385.77327,-419.10351)">
                    <path fill="currentColor" fill-rule="evenodd" stroke-width="18.765" stroke-linecap="round" stroke-linejoin="bevel"

                    <path fill="currentColor" d="m 83.950747,108.83192 -40.218459,-0.0705 20.10923,-17.586364 z"/>
                        </g>
                    </svg>
                </button>
            </div>
            <div id="audResultSet">
                <svg
                    viewBox="0 0 500 300"
                    width="500"
                    height="300"
                    id="resultSpk"
                >

                    fill="currentColor"
                    />
                </svg>
                <p class="beigeText infoSetTxt firstMatch" id="audAccuracyTxt"></p>
                <p id="audMatches" class="greenTxt infoSetTxt"></p>
                <p id="audMisses" class="redTxt infoSetTxt"></p>
                <p id="audFalses" class="redTxt infoSetTxt"></p>
            </div>
        </div>
    </div>
    <div id="initialScreen" class="screens">
        <header>
            <button class="statsBtn">
                <svg class="statsImg" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"

                        s-7.156-16-16-16S448,103.156,448,112z M352,304c0,8.844,7.156,16,16,16s16-7.156,16-16s-7.156-16-16-16S352,295.156,352,304z

                        s16-7.156,16-16s-7.156-16-16-16S128,327.156,128,336z" fill="currentColor"/>
                </svg>
            </button>
            <button class="btnSetting">
                <svg class="imgSetting" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                </svg>
            </button>
        </header>
        <div id="initialContainer">
            <div class="initialNDisplayer">
                <button class="beigeText btnN btnNMinus">-</button>
                <p class="initialNDisplayerText beigeText NDisplayer"></p>
                <button class="beigeText btnN btnNAdd">+</button>
            </div>
            <div id="playInfoContainer">
                <p class="beigeText goalText">daily goal</p>
                <p class="beigeText goalText dailyNumber"></p>
                <button class="playBtn">
                    <svg class="playImg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M7.23832 3.04445C5.65196 2.1818 3.75 3.31957 3.75 5.03299L3.75 18.9672C3.75 20.6806 5.65196 21.8184 7.23832 20.9557L20.0503 13.9886C21.6499 13.1188 21.6499 10.8814 20.0503 10.0116L7.23832 3.04445ZM2.25 5.03299C2.25 2.12798 5.41674 0.346438 7.95491 1.72669L20.7669 8.6938C23.411 10.1317 23.411 13.8685 20.7669 15.3064L7.95491 22.2735C5.41674 23.6537 2.25 21.8722 2.25 18.9672L2.25 5.03299Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
        <button class="logBtn beigeText">login</button>
    </div>
    <div id="settingScreen" class="screens">
        <header>
            <button class="returnBtn">◀</button>
        </header>
        <div id="settingsContainer">
            <div class="genSettingsContainer">
                <div class="keySettings">
                    <p class="beigeText genSettingsText">daily goal</p>
                    <input type="text" inputmode="numeric" class="intField dailyGoalField">
                </div>
            </div>
            <div class="keySettingsContainer">
                <p class="beigeText settingsTitle">keyboard control settings:</p>
                <div class="keySettings">
                    <p class="beigeText settingsText">visual input</p>
                    <button class="keySettingBtn" id="visKeyBtn"></button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">auditory input</p>
                    <button class="keySettingBtn" id="audKeyBtn"></button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">return</p>
                    <button class="keySettingBtn" id="returnKeyBtn"></button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">play/replay</p>
                    <button class="keySettingBtn" id="playKeyBtn"></button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">open settings</p>
                    <button class="keySettingBtn" id="openSettingsKeyBtn"></button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">open stats</p>
                    <button class="keySettingBtn" id="openStatsKeyBtn">None</button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">add n</p>
                    <button class="keySettingBtn" id="addNKeyBtn">None</button>
                </div>
                <div class="keySettings">
                    <p class="beigeText settingsText">subtract n</p>
                    <button class="keySettingBtn" id="subtractNKeyBtn">None</button>
                </div>
            </div>
        </div>
    </div>
    <div id="statsScreen" class="screens">
        <header>
            <button class="returnBtn">◀</button>
        </header>
    </div>
    <div id="popupContainer">
        <div id="changeKeyPopup" class="popups">
            <div class="popupTextDiv">
                <p class="popupText beigeText">press any desired key</p>
                <p class="beigeText">click anywhere to cancel</p>
            </div>
        </div>
        <div id="loginPopup" class="popups">
            <div class="loginTextDiv">
                <div>
                    <p class="loginPopupText beigeText">user/email:</p>
                    <input type="text" class="inputLogin" id="loginUser">
                </div>
                <div>
                    <p class="loginPopupText beigeText">password:</p>
                    <input type="password" class="inputLogin" id="loginPassword">
                </div>
                <div id="loginBtnDiv">
                    <button id="loginBtn">login</button>
                </div>
            </div>
        </div>
    </div>
</body>
